name: hubris
version: "1.8.1"
description: >-
  HUBRIS: Heuristic Unverified-Belief Research Injection Signal. It makes live web research the
  default before a factual answer. Every turn gets classified; when the question turns on current
  facts, the model is told to search and cite. It records whether a web tool actually ran, and
  marks the reply when none did, because knowledge past a training cutoff is undated at best and
  overtaken by events at worst. Eleven topics decide what counts as current facts, each topic is a
  switch, and the footer names the subject that fired. Deterministic, standard library only, no
  model calls of its own.
author: raidbeforebed
kind: standalone
requires_hermes: ">=0.22.0"
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - transform_llm_output
config_schema:
  enabled:
    type: bool
    default: true
    label: Enable hubris
    description: Turn it off without uninstalling.
  nag_on_explicit:
    type: bool
    default: false
    label: Warn me even when I asked
    description: >-
      A turn you asked for gets the search request but no warning, because you already asked.
      Turn this on to get the warning too.
  disabled_subjects:
    type: str
    default: ""
    placeholder: "money.prices, hardware.stock"
    label: Muted subjects
    description: >-
      Silence one subject inside a topic that stays on. Write money.prices for one subject, or
      money for the whole topic. The warning in a reply names the id to copy.
  exempt_patterns:
    type: str
    default: ""
    placeholder: "my thesis, the draft"
    label: Never research these
    description: >-
      Words or phrases that never trigger research, comma separated or one per line. They beat
      every topic and subject, so this is the override for a word the rules misread.
  extra_trigger_phrases:
    type: str
    default: ""
    placeholder: "kubernetes, terraform plan"
    label: Always research these
    description: >-
      Words or phrases that always mean check the web, comma separated or one per line. Use it
      for a domain the topics miss.
  quiet_platforms:
    type: str
    default: ""
    placeholder: "discord_voice, telegram"
    label: Quiet platforms
    description: Platforms that get no search request and no warning, comma separated.

  # ---- topics ---------------------------------------------------------------------------
  # One switch per topic. A topic off silences everything inside it; mute single subjects in
  # the field above and leave their siblings alone.
  topic_ai:
    type: bool
    default: true
    label: "AI, models and harnesses"
    description: >-
      Model names, versions and coding harnesses. They change monthly. Subjects: ai.models, ai.harnesses, ai.agents.
  topic_freshness:
    type: bool
    default: true
    label: "Freshness"
    description: >-
      Wording that says the answer may have moved. Subjects: freshness.recency.
  topic_choices:
    type: bool
    default: true
    label: "Comparisons and picks"
    description: >-
      Asking which one, because someone already compared them. Subjects: choices.comparison.
  topic_money:
    type: bool
    default: true
    label: "Money and markets"
    description: >-
      Prices, deals and rates, where last month's number is wrong. Subjects: money.prices, money.rates.
  topic_software:
    type: bool
    default: true
    label: "Software and versions"
    description: >-
      Releases, deprecations and docs. The fastest-moving facts an agent gets wrong. Subjects: software.releases, software.docs.
  topic_hardware:
    type: bool
    default: true
    label: "Hardware and gear"
    description: >-
      Specs, benchmarks and whether the thing is in stock. Subjects: hardware.specs, hardware.stock.
  topic_law:
    type: bool
    default: true
    label: "Law, policy and benefits"
    description: >-
      Rules, deadlines and entitlements, all on someone else's schedule. Subjects: law.statutes, law.deadlines.
  topic_health:
    type: bool
    default: true
    label: "Health and medicine"
    description: >-
      Guidance and alerts, where a stale answer costs the most. Subjects: health.guidance, health.alerts.
  topic_local:
    type: bool
    default: true
    label: "Local and logistics"
    description: >-
      Weather, hours and roads. True near you, right now. Subjects: local.weather, local.places.
  topic_games:
    type: bool
    default: true
    label: "Games and modpacks"
    description: >-
      A modpack's progression changes every release. The case that started this. Subjects: games.versions, games.guides, games.recipes.
  topic_news:
    type: bool
    default: true
    label: "News and current events"
    description: >-
      Elections, conflicts and headlines, which change by the hour. Subjects: news.politics, news.world.
