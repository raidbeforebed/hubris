name: hubris
version: "1.2.1"
description: >-
  HUBRIS: Heuristic Unverified-Belief Research Injection Signal. Makes live web research the
  default before any factual answer. Classifies each turn, injects a search directive when the
  question turns on current external facts, records whether a real web tool was actually used,
  and stamps the reply when none was, because knowledge past a training cutoff is at best
  undated and at worst overtaken by events. Stored data, local archives and model training are
  treated as fallbacks that must be labelled as such. Deterministic: no LLM calls, standard
  library only.
author: raidbeforebed
kind: standalone
requires_hermes: ">=0.22.0"
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - transform_llm_output
config_schema:
  enabled:
    type: bool
    default: true
    label: Enable hubris
    description: Turn the behaviour off without disabling or removing the plugin.
  quiet_platforms:
    type: str
    default: ""
    label: Quiet platforms
    description: >-
      Platform names where no directive is injected and no footer is appended, comma
      separated. For example: discord_voice, telegram. Leave empty for none.
  extra_trigger_phrases:
    type: str
    default: ""
    label: Extra research phrases
    description: >-
      Phrases that mean "check the live web", on top of the built-in rules, separated by
      commas or one per line. For example: kubectl, homelab price. Leave empty to use the
      built-in rules only. Matched case-insensitively as plain text.
  extra_skip_phrases:
    type: str
    default: ""
    label: Extra never-research phrases
    description: >-
      Phrases that must never trigger research, comma separated. These win over every
      trigger, so this is the safe override for a word the built-in rules misread. Leave
      empty for none.
