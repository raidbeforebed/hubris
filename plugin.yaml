name: hubris
version: "1.7.0"
description: >-
  HUBRIS: Heuristic Unverified-Belief Research Injection Signal. Makes live web research the
  default before any factual answer. Classifies each turn, injects a search directive when the
  question turns on current external facts, records whether a real web tool was actually used,
  and stamps the reply when none was, because knowledge past a training cutoff is at best
  undated and at worst overtaken by events. A taxonomy of ten topics decides what counts as
  current external facts and every topic is a switch; individual subjects can be muted in one
  field, and the footer names whatever fired. Deterministic: no LLM calls, standard library only.
author: raidbeforebed
kind: standalone
requires_hermes: ">=0.22.0"
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - transform_llm_output
config_schema:
  enabled:
    type: bool
    default: true
    label: Enable hubris
    description: Turn the behaviour off without disabling or removing the plugin.
  nag_on_explicit:
    type: bool
    default: false
    label: Warn even when I asked
    description: >-
      When you say "go and look this up", hubris injects the directive but stays quiet in the
      reply by default, because you already asked. Turn this on to get the footer anyway.
  disabled_subjects:
    type: str
    default: ""
    label: Muted subjects
    description: >-
      Subjects to silence inside a topic that is otherwise on, comma separated. Write a subject
      (money.prices) or a whole topic (money). The footer names ids in this form, so you can
      copy one straight from a warning. Leave empty for none.
  exempt_patterns:
    type: str
    default: ""
    label: Never research these
    description: >-
      Phrases that must never trigger research, comma separated or one per line. These win over
      every topic and subject, so this is the safe override for a word the rules misread.
  extra_trigger_phrases:
    type: str
    default: ""
    label: Always research these
    description: >-
      Phrases that always mean "check the live web", for domains the taxonomy does not cover.
      These bypass the taxonomy and the question-shape test. Leave empty for none.
  quiet_platforms:
    type: str
    default: ""
    label: Quiet platforms
    description: >-
      Platforms that get neither the directive nor the footer, comma separated. For example:
      discord_voice, telegram. Leave empty for none.

  # ---- topics ---------------------------------------------------------------------------
  # One switch per topic. A whole topic off silences everything inside it; use the muted
  # subjects field above to silence one subject and leave its siblings alone.
  topic_freshness:
    type: bool
    default: true
    label: "Freshness"
    description: >-
      Wording that means the answer may have moved since the model learned it. Covers: recency wording. Ids: freshness.recency.
  topic_choices:
    type: bool
    default: true
    label: "Comparisons and picks"
    description: >-
      Asking which one, which usually means someone has already compared them. Covers: comparisons and picks. Ids: choices.comparison.
  topic_money:
    type: bool
    default: true
    label: "Money and markets"
    description: >-
      Prices, deals and rates, where last month's number is wrong this month. Covers: prices and deals; rates and crypto. Ids: money.prices, money.rates.
  topic_software:
    type: bool
    default: true
    label: "Software and versions"
    description: >-
      Releases, deprecations and docs: the fastest-moving facts an agent can be wrong about. Covers: releases and versions; documentation. Ids: software.releases, software.docs.
  topic_hardware:
    type: bool
    default: true
    label: "Hardware and gear"
    description: >-
      Specs, benchmarks and whether the thing is actually in stock. Covers: specs and reviews; availability. Ids: hardware.specs, hardware.stock.
  topic_law:
    type: bool
    default: true
    label: "Law, policy and benefits"
    description: >-
      Rules, deadlines and entitlements, all of which move on someone else's schedule. Covers: rules and legality; deadlines and entitlements. Ids: law.statutes, law.deadlines.
  topic_health:
    type: bool
    default: true
    label: "Health and medicine"
    description: >-
      Guidance and alerts, where a stale answer is the expensive kind of wrong. Covers: guidance; recalls and outbreaks. Ids: health.guidance, health.alerts.
  topic_local:
    type: bool
    default: true
    label: "Local and logistics"
    description: >-
      Weather, hours and roads: true only near you, and only right now. Covers: weather; places and roads. Ids: local.weather, local.places.
  topic_games:
    type: bool
    default: true
    label: "Games and modpacks"
    description: >-
      The case that started this: a modpack's progression changes every release. Covers: packs and versions; guides and progression; recipes, crafting and wikis. Ids: games.versions, games.guides, games.recipes.
  topic_news:
    type: bool
    default: true
    label: "News and current events"
    description: >-
      Elections, conflicts and headlines, where the answer changes by the hour. Covers: headlines, elections and officials; world events. Ids: news.politics, news.world.
